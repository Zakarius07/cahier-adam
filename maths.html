<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cahier de maths · 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout : cahier d'écolier. En-tête collant avec les deux leçons en onglets, une colonne de fiches
   sur papier Seyès, réponses à l'encre bleue, correction et note au stylo rouge en bas de la copie. */
:root{
  --paper:#F7F8FE; --sheet:#FFFFFF; --ink:#1B2350; --muted:#5B6287; --rule:#DCE0F3;
  --seyes:#CBD1F1; --seyes-fine:#E7EAF9; --margin:#E9A3A3;
  --blue:#2443C8; --blue-soft:#ECF0FF; --red:#CF2E29; --red-soft:#FDEDEC; --green:#1C7F47; --green-soft:#E4F4EA;
  --amber:#B86B00;
  --gram:#6A45C0; --ortho:#DA5338;
  --c-def:#2463C9; --c-con:#0E8A86; --c-ind:#B86B00; --c-pos:#8A3FC4; --c-dem:#C2367B;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --acc:var(--gram);
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11152A; --sheet:#191E37; --ink:#E7EAFF; --muted:#A3A9CF; --rule:#2C3358;
  --seyes:#2A3159; --seyes-fine:#1F2546; --margin:#7E3943;
  --blue:#93A9FF; --blue-soft:#222B5C; --red:#FF7D72; --red-soft:#3A1E26; --green:#62D59A; --green-soft:#16372A;
  --amber:#F2B04C; --gram:#B89CFF; --ortho:#FF8C70;
  --c-def:#7DA8FF; --c-con:#45D1C9; --c-ind:#F2B04C; --c-pos:#C99AF5; --c-dem:#FF85BC;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11152A; --sheet:#191E37; --ink:#E7EAFF; --muted:#A3A9CF; --rule:#2C3358;
  --seyes:#2A3159; --seyes-fine:#1F2546; --margin:#7E3943;
  --blue:#93A9FF; --blue-soft:#222B5C; --red:#FF7D72; --red-soft:#3A1E26; --green:#62D59A; --green-soft:#16372A;
  --amber:#F2B04C; --gram:#B89CFF; --ortho:#FF8C70;
  --c-def:#7DA8FF; --c-con:#45D1C9; --c-ind:#F2B04C; --c-pos:#C99AF5; --c-dem:#FF85BC;
  color-scheme:dark }
body[data-lesson="acc"]{ --acc:var(--ortho) }

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font:400 17px/1.55 var(--f-body);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes-fine) 31px 32px),
    repeating-linear-gradient(to right, transparent 0 31px, var(--seyes-fine) 31px 32px);
}
.wrap{max-width:780px; margin:0 auto; padding-inline:16px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--acc); outline-offset:2px; border-radius:6px}

/* ---- en-tête ---- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule)}
.top .wrap{display:flex; align-items:center; gap:12px; padding-block:10px; flex-wrap:wrap}
.brand{font:800 15px/1 var(--f-display); letter-spacing:.02em; margin-right:auto; white-space:nowrap}
.brand small{display:block; font:400 12px/1.3 var(--f-body); color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-top:3px}
.tabs{display:flex; gap:6px; max-width:100%; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.tab{display:flex; align-items:center; gap:8px; border:1.5px solid var(--rule); background:var(--sheet); border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer; font-weight:700; font-size:15px}
.tab .num{display:grid; place-items:center; width:26px; height:26px; border-radius:7px; color:#fff; font:800 14px/1 var(--f-display)}
.tab[data-l="det"] .num{background:var(--gram)} .tab[data-l="acc"] .num{background:var(--ortho)}
.tab[aria-selected="true"]{border-color:var(--ink); background:var(--ink); color:var(--paper)}

/* ---- tête de leçon ---- */
.hero{padding-block:26px 6px; display:grid; gap:10px}
.eyebrow{font:700 13px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--acc)}
.hero h1{font-size:clamp(30px,6vw,44px); font-weight:800; line-height:1.05; letter-spacing:-.01em}
.hero p{margin:0; color:var(--muted); max-width:60ch}
.prog{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.bar{flex:1; height:8px; border-radius:99px; background:var(--rule); overflow:hidden; max-width:320px}
.bar i{display:block; height:100%; width:0; background:var(--acc); border-radius:99px; transition:width .3s}

details.memo{background:var(--sheet); border:1.5px solid var(--rule); border-radius:var(--r); margin-top:14px}
details.memo summary{cursor:pointer; padding:12px 16px; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:12px}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::after{content:"Afficher"; font-weight:400; color:var(--acc); font-size:14px}
details.memo[open] summary::after{content:"Masquer"}
.memo-body{padding:0 16px 14px; overflow-x:auto}
.memo table{border-collapse:collapse; width:100%; font-size:15px; min-width:420px}
.memo th,.memo td{text-align:left; vertical-align:top; padding:8px 10px; border-top:1px solid var(--rule)}
.memo th{width:32%; font-weight:700}

/* ---- fiches ---- */
.sheets{display:grid; gap:16px; padding-block:18px 8px}
.part{font:800 14px/1 var(--f-display); letter-spacing:.06em; text-transform:uppercase; color:var(--acc); padding:14px 2px 0; display:flex; align-items:center; gap:10px}
.part::after{content:""; flex:1; height:2px; background:var(--acc); opacity:.35; border-radius:2px}
.ex{background:var(--sheet); border:1.5px solid var(--rule); border-radius:var(--r); padding:16px 16px 14px; min-width:0}
.ex-h{display:flex; gap:12px; align-items:flex-start}
.ex-n{flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:8px; background:var(--acc); color:#fff; font:800 16px/1 var(--f-display)}
.ex-t{flex:1; min-width:0; font-weight:700; line-height:1.4; padding-top:3px}
.ex-score{flex:none; font:700 24px/1 var(--f-hand); color:var(--red); padding-top:2px; font-variant-numeric:tabular-nums}
.ex-score.full{color:var(--green)}
.hint{margin:8px 0 0 42px; color:var(--muted); font-style:italic; font-size:15px}
.textbox{margin:12px 0 0; padding:12px 14px; border-radius:10px; background:var(--blue-soft); line-height:1.9}
ol.items{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:4px; counter-reset:it}
ol.items>li{counter-increment:it; display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px dashed var(--rule); line-height:2.15; min-width:0}
ol.items>li:last-child{border-bottom:0}
ol.items>li::before{content:counter(it) "."; flex:none; width:24px; text-align:right; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums}
.it{flex:1; min-width:0}
.pre{display:block; color:var(--muted); font-size:15px; line-height:1.5}

/* blancs à remplir : encre bleue */
.blank{font:700 17px/1.3 var(--f-body); color:var(--blue); background:var(--blue-soft); border:0; border-bottom:2px dotted var(--blue);
  border-radius:6px 6px 0 0; padding:3px 6px; width:6.2em; max-width:100%; min-width:0}
.blank.m{width:10em}
.blank.l{width:100%; max-width:24em; display:block; margin-top:2px}
.blank:focus{outline:none; border-bottom-style:solid; box-shadow:0 2px 0 0 var(--blue)}
.blank.ok{color:var(--green); background:var(--green-soft); border-bottom:2px solid var(--green)}
.blank.ko{color:var(--muted); background:var(--red-soft); border-bottom:2px solid var(--red); text-decoration:line-through; text-decoration-color:var(--red)}
.fix{font:700 23px/1 var(--f-hand); color:var(--red); margin:0 .25em; white-space:nowrap}
.fix.sm{font-size:19px}
.why{display:block; font:600 19px/1.25 var(--f-hand); color:var(--red)}

/* choix */
.opts{display:inline-flex; flex-wrap:wrap; gap:6px; vertical-align:middle; margin:2px 4px}
.opt{border:1.5px solid var(--rule); background:var(--sheet); border-radius:999px; padding:3px 12px; cursor:pointer; line-height:1.5; font-size:16px}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:var(--sheet); font-weight:700}
.opt.ok[aria-pressed="true"]{background:var(--green); border-color:var(--green)}
.opt.ko[aria-pressed="true"]{background:var(--red-soft); border-color:var(--red); color:var(--red); text-decoration:line-through}
.opt.should{border:2px solid var(--red); color:var(--red); font-weight:700; border-radius:46% 54% 50% 50% / 60% 45% 55% 40%}
.opt:disabled{cursor:default}

/* mots à toucher */
.tok{cursor:pointer; border-radius:4px; padding:0 1px; text-decoration:none; transition:background .15s}
.tok:hover{background:var(--blue-soft)}
.tok.on{text-decoration:underline 3px var(--blue); text-underline-offset:5px; color:var(--blue); font-weight:700}
.tok.cur{outline:2px solid var(--blue); outline-offset:1px}
.tok[data-tag]{font-weight:700; text-decoration:underline 3px var(--tc); text-underline-offset:5px; color:var(--tc)}
.tok[data-tag]::after{content:attr(data-tag); font:700 11px/1 var(--f-body); vertical-align:super; margin-left:2px; letter-spacing:.02em}
.tok.err{color:var(--red); text-decoration:underline wavy 2px var(--red); text-underline-offset:5px; font-weight:700}
.tok.c-ok{color:var(--green); text-decoration-color:var(--green); background:var(--green-soft)}
.tok.c-fp{color:var(--red); text-decoration:line-through 2px var(--red); background:var(--red-soft)}
.tok.c-miss{outline:2px solid var(--red); outline-offset:1px; border-radius:40% 60% 50% 50% / 60% 40% 60% 40%}
.tok.c-ko{color:var(--red); background:var(--red-soft)}
.locked .tok{cursor:default}
.locked .tok:hover{background:none}
.t-def{--tc:var(--c-def)} .t-con{--tc:var(--c-con)} .t-ind{--tc:var(--c-ind)} .t-pos{--tc:var(--c-pos)} .t-dem{--tc:var(--c-dem)}

.catbar{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center}
.catbar .lbl{font-size:14px; color:var(--muted); width:100%}
.cat{border:2px solid var(--tc); color:var(--tc); background:var(--sheet); border-radius:999px; padding:4px 12px; cursor:pointer; font-weight:700; font-size:15px}
.cat:disabled{opacity:.45; cursor:default}
.cat.clear{--tc:var(--muted)}
.countline{font-size:14px; color:var(--muted); margin-top:8px; font-variant-numeric:tabular-nums}

.fixlist{display:grid; gap:8px; margin-top:12px}
.fixrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.fixrow .w{font-weight:700; color:var(--red); text-decoration:line-through}
.empty{color:var(--muted); font-size:15px; font-style:italic}

select.sel{font:700 16px var(--f-body); color:var(--blue); background:var(--blue-soft); border:0; border-bottom:2px dotted var(--blue); border-radius:6px 6px 0 0; padding:4px 6px; max-width:100%}
select.sel.ok{color:var(--green); background:var(--green-soft); border-bottom:2px solid var(--green)}
select.sel.ko{color:var(--red); background:var(--red-soft); border-bottom:2px solid var(--red)}
.det{font-weight:700; display:inline-block; min-width:3em}

textarea.write{width:100%; min-height:130px; margin-top:10px; font:700 17px/32px var(--f-body); color:var(--blue); border:1.5px solid var(--rule); border-radius:10px; padding:0 12px;
  background:var(--sheet) repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes) 31px 32px); background-attachment:local; resize:vertical}
.checks{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chk{font-size:14px; border-radius:999px; padding:3px 10px; border:1.5px solid var(--rule); color:var(--muted)}
.chk.yes{border-color:var(--tc); color:var(--tc); font-weight:700}
.bonus{margin-top:16px; padding-top:14px; border-top:2px dashed var(--rule)}
.bonus h3{font-size:17px}

/* ---- copie / note ---- */
.finish{margin-block:22px 40px; border-radius:var(--r); border:1.5px solid var(--rule); padding:20px 18px 20px 56px; position:relative;
  background:var(--sheet) repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes) 31px 32px)}
.finish::before{content:""; position:absolute; left:40px; top:0; bottom:0; width:2px; background:var(--margin)}
.finish h2{font-size:24px; font-weight:800}
.finish p{margin:8px 0 0; max-width:56ch}
.btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.btn{border:0; border-radius:999px; padding:12px 22px; font-weight:700; font-size:16px; cursor:pointer; background:var(--ink); color:var(--paper)}
.btn.red{background:var(--red); color:#fff}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.warn{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--red-soft); color:var(--ink)}
.result{display:flex; flex-wrap:wrap; align-items:center; gap:18px 28px}
.mark{display:grid; place-items:center; width:150px; height:118px; border:3px solid var(--red); border-radius:52% 48% 55% 45% / 50% 58% 42% 50%;
  transform:rotate(-5deg); color:var(--red); font:700 54px/1 var(--f-hand); font-variant-numeric:tabular-nums}
.mark small{font-size:28px}
.appr{font:700 30px/1.15 var(--f-hand); color:var(--red); max-width:24ch}
.chips-lbl{font:700 13px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:18px!important}
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(60px,1fr)); gap:8px; margin-top:10px}
.chip{border-radius:10px; padding:6px 8px; font-size:13px; border:1.5px solid var(--rule); background:var(--sheet); font-variant-numeric:tabular-nums; display:grid; justify-items:center; gap:2px; line-height:1.2}
.chip b{font:800 17px/1 var(--f-display)}
.chip.full{border-color:var(--green); color:var(--green)}
.chip.part{border-color:var(--amber); color:var(--amber)}
.chip.zero{border-color:var(--red); color:var(--red)}
.foot{color:var(--muted); font-size:13px; padding-bottom:28px}

/* ---- enregistrement, bilan, suivi ---- */
.status{margin-top:14px; font-size:15px; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.status.ok{color:var(--green); font-weight:700} .status.bad{color:var(--red)}
.btn.sm{padding:8px 16px; font-size:15px}
.field{display:grid; gap:4px; margin-top:14px; max-width:320px}
.field label{font-size:14px; font-weight:700}
.field input{font:700 17px var(--f-body); color:var(--blue); background:var(--sheet); border:1.5px solid var(--rule); border-radius:10px; padding:8px 10px; min-width:0}
.bilan{margin-top:22px; display:grid; gap:12px}
.bilan h3{font-size:20px}
.sub{font:700 13px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
.b-kid{border-left:4px solid var(--acc); padding:4px 0 4px 14px; margin:0; max-width:60ch}
.b-par{background:var(--blue-soft); border-radius:10px; padding:12px 14px; display:grid; gap:8px}
.b-par ul{margin:0; padding-left:20px} .b-par li{margin:3px 0}
.b-par p{margin:0}
.tagrow{display:flex; flex-wrap:wrap; gap:6px}
.rtag{font-size:14px; border-radius:999px; padding:3px 10px; border:1.5px solid var(--red); color:var(--red); background:var(--sheet)}
.thinking{color:var(--muted); font-style:italic; margin-top:16px!important}
.sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:6px}
.sumcard{background:var(--sheet); border:1.5px solid var(--rule); border-radius:var(--r); padding:14px 16px; display:grid; gap:8px; min-width:0}
.sumcard h3{font-size:17px}
.kpis{display:flex; gap:22px; flex-wrap:wrap; font-variant-numeric:tabular-nums}
.kpi b{display:block; font:800 24px/1.1 var(--f-display)}
.kpi span{font-size:13px; color:var(--muted)}
.trend{font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; margin:0}
.copies{display:grid; gap:12px; margin-block:18px 40px}
.copy{background:var(--sheet); border:1.5px solid var(--rule); border-radius:var(--r); padding:14px 16px; display:grid; gap:12px; min-width:0}
.ex:not(.locked){-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.ex:not(.locked) input,.ex:not(.locked) textarea{-webkit-user-select:text; user-select:text}
.bplus{display:grid; place-items:center; align-content:center; color:var(--green); font:800 40px/1 var(--f-hand,inherit)}
.bplus small{font:700 14px/1 var(--f-body,inherit)}
.totalline{font-size:18px; color:var(--green); margin:6px 0 0}
.totalline small{color:var(--muted); font-size:13px}
.mbox{display:grid; justify-items:end; gap:4px; flex:none}
.mplus{font:800 14px/1.2 var(--f-body,inherit); color:var(--green); white-space:nowrap}
#profBtn{display:none!important}
.lvl{font-size:15px; color:var(--muted); margin:6px 0 0}
.rl{margin:6px 0; padding-left:22px; display:grid; gap:6px; font-size:15px; line-height:1.45}
.memo table.rt{min-width:0; margin:8px 0; text-align:center}
.memo table.rt th,.memo table.rt td{text-align:center; width:auto; padding:7px 6px}
.memo table.rt tbody th{text-align:left; font-weight:600}
.memo table.rt .cur{background:var(--blue-soft); font-weight:800}
.memo table.rt small{font-weight:600; color:var(--acc); font-size:11px}
.timer[hidden]{display:none}
.timer{position:fixed; right:14px; bottom:14px; z-index:30; display:flex; flex-direction:column; align-items:flex-end; gap:2px; padding:9px 14px; border-radius:14px; background:var(--sheet); border:1.5px solid var(--rule); box-shadow:0 4px 16px rgba(0,0,0,.14); font-variant-numeric:tabular-nums}
.timer span{font:800 22px/1 var(--f-display,inherit); color:var(--acc)}
.timer small{font-size:12px; color:var(--muted); max-width:200px; text-align:right}
.timer.over{border-color:var(--red)} .timer.over span{color:var(--red)}
.bonuses{list-style:none; margin:12px 0 4px; padding:10px 14px; border-radius:12px; background:var(--blue-soft); display:grid; gap:6px; font-size:15px}
.bonuses li.ok{color:var(--green)}
.jeu{margin:12px 0 4px; padding:12px 14px; border-radius:12px; border:2px dashed var(--rule); font-size:16px}
.jeu.on{border-style:solid; border-color:var(--green); color:var(--green); background:var(--sheet)}
.flags .game{font:700 12px/1 var(--f-body,inherit); color:var(--green); padding:5px 8px; border-radius:99px; border:1px solid var(--green)}
.flags .game.chk{color:#8a4b00; border-color:#f0c987}
.flags{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px}
.flags .tm{font:600 13px/1 var(--f-body,inherit); color:var(--ink2,#555); padding:5px 8px; border-radius:99px; background:var(--blue-soft)}
.flags .flag{font:700 12px/1 var(--f-body,inherit); color:#8a4b00; background:#fff1d6; border:1px solid #f0c987; padding:5px 8px; border-radius:99px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flags .flag{color:#ffd9a0; background:#4a3411; border-color:#7a5a20}}
:root[data-theme="dark"] .flags .flag{color:#ffd9a0; background:#4a3411; border-color:#7a5a20}
.copy-h{display:flex; gap:12px; align-items:flex-start}
.copy-h .meta{flex:1; min-width:0}
.copy-h .when{font-size:14px; color:var(--muted)}
.copy-h .what{font-weight:700}
.mini{flex:none; display:flex; align-items:baseline; justify-content:center; gap:1px; padding-top:14px!important; min-width:78px; height:56px; padding:0 8px; border:2.5px solid var(--red); border-radius:52% 48% 55% 45% / 50% 58% 42% 50%;
  transform:rotate(-4deg); color:var(--red); font:700 27px/1 var(--f-hand); font-variant-numeric:tabular-nums}
.mini.good{border-color:var(--green); color:var(--green)}
.lt{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px; color:#fff; font:800 12px/1 var(--f-display); vertical-align:1px; margin-right:6px}
.lt.det{background:var(--gram)} .lt.acc{background:var(--ortho)}
.copy details summary{cursor:pointer; color:var(--blue); font-weight:700; font-size:15px}
.copy .chips{margin-top:0}
.errs{margin:8px 0 0; padding:0; list-style:none; display:grid; gap:6px; font-size:15px}

 memo:`<table>
 <tr><th>Cercle</th><td>Le <b>cercle</b> de centre O et de rayon r est l'ensemble des points situés à la distance r de O. OM = r ⟺ M ∈ cercle.</td></tr>
 <tr><th>Disque</th><td>Le <b>disque</b> de centre O et de rayon r est la surface limitée par le cercle : tous les points M tels que OM ≤ r. Le cercle fait partie du disque.</td></tr>
 <tr><th>Rayon</th><td>Un <b>rayon</b> relie le centre à un point du cercle. Tous les rayons ont la même longueur r.</td></tr>
 <tr><th>Diamètre</th><td>Un <b>diamètre</b> est une corde qui passe par le centre. Sa longueur est <b>deux fois le rayon</b> : d = 2 × r.</td></tr>
 <tr><th>Corde</th><td>Une <b>corde</b> relie deux points du cercle. Aucune corde n'est plus longue que le diamètre.</td></tr>
 <tr><th>Arc</th><td>Un <b>arc de cercle</b> est une partie du cercle limitée par deux points.</td></tr>
 <tr><th>Distances</th><td>Les points à exactement 3 cm de A forment un cercle. Les points à moins de 3 cm de A forment un disque. Les points à une distance de A comprise entre 1,8 et 2,1 cm forment une <b>couronne</b>.</td></tr></table>`,

function pickN(arr,k){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,k); }
function makeDraw(L){
  const last=(state.last&&state.last[L.id])||{}; const out=[];
  partRanges(L).forEach(([a,b],i)=>{
    const nums=[]; for(let n=a;n<=b;n++) nums.push(n);
    const cnt=PART_COUNT[L.id][i]; const fresh=nums.filter(n=>last[n]===undefined); const pool=fresh.length>=cnt?fresh:nums;
    pickN(pool,cnt).forEach(n=>{ const ss=[0,1,2].filter(x=>x!==last[n]); out.push([n,pickN(ss,1)[0]]); });
  });
  out.sort((x,y)=>x[0]-y[0]);

}

function tokenize(src){
  const re=/\[([^\]|]+)(?:\|([^\]]+))?\]|\{([^}|]+)\|([^}]+)\}|([A-Za-zÀ-ÖØ-öø-ÿŒœ]+['’]?)|(\s+)|([^\sA-Za-zÀ-ÖØ-öø-ÿŒœ\[\{]+)/g;
  const out=[]; let m;
  while((m=re.exec(src))){
    if(m[1]!==undefined) out.push({w:m[1],key:m[2]||true});
    else if(m[3]!==undefined) out.push({w:m[3],fix:m[4]});
    else if(m[5]!==undefined) out.push({w:m[5]});
    else if(m[6]!==undefined) out.push({sp:m[6]});
    else out.push({p:m[7]});
  }
  return out;
}

  if(n>=17) kid=`Excellent travail ! Tu maîtrises très bien « ${L.title} ».`;
  else if(n>=14) kid=`Très bien ! Tu as compris l’essentiel de la leçon « ${L.title} ».`;
  else if(n>=10) kid=`C’est un bon début : une bonne partie de la leçon est acquise, mais il reste des points à travailler.`;
  else kid=`Courage ! Cette leçon est nouvelle et elle demande encore de l’entraînement. C’est normal de se tromper au début.`;
  if(best&&best.r>=0.8) kid+=` Ton point fort : ${low(best.nm)}.`;
  if(worst&&worst.r<0.8&&worst!==best) kid+=` Relis l’aide-mémoire sur ${low(worst.nm)}, puis refais une fiche : chaque fiche est différente.`;
  else kid+=` Refais une fiche pour viser le niveau suivant !`;
  const parents=[];
  if(ok.length) parents.push('Acquis : '+ok.map(p=>low(p.nm)).join(', ')+'.');
  if(mid.length) parents.push('En cours d’acquisition : '+mid.map(p=>low(p.nm)).join(', ')+'.');
  if(ko.length) parents.push('Non acquis : '+ko.map(p=>low(p.nm)).join(', ')+'.');
  const er=R.erreurs.filter(e=>e.attendu&&e.donne);
  er.slice(0,2).forEach(e=>parents.push(`Exemple d’erreur (ex. ${e.n}) : « ${plain(e.q).slice(0,70)} » → réponse « ${plain(e.donne).slice(0,40)} » au lieu de « ${plain(e.attendu).slice(0,40)} ».`));
  const W=wch(L.id); const mins=Math.round(W.ms/60000*10)/10;
  parents.push(`Temps de travail : ${String(mins).replace('.',',')} min (conseillé : ${goalTxt(L)}).`+(W.paste||W.copy||W.away>1?' Attention : '+[W.paste?W.paste+' collage(s)':'',W.copy?W.copy+' copie(s)':'',W.away>1?'page quittée '+W.away+' fois':''].filter(Boolean).join(', ')+'.':''));
  const a_revoir=P.filter(p=>p.r<0.8).sort((a,b)=>a.r-b.r).slice(0,4).map(p=>p.nm);
  const conseil=a_revoir.length?`Lire ensemble « Comprendre la leçon » et l’aide-mémoire (partie « ${a_revoir[0]} »), faire expliquer la règle à voix haute avec un exemple inventé, puis refaire une fiche dans 2 ou 3 jours.`:`Leçon maîtrisée : refaire une fiche dans une semaine pour vérifier que c’est bien retenu, puis passer à la leçon suivante.`;
  return {enfant:kid, parents:parents.slice(0,6), a_revoir, conseil};
}

const plain=s=>String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

function stash(){ const p=curP(); if(p) p.w={set:state.set,ans:state.ans,done:state.done,bonus:state.bonus,copyId:state.copyId,bilan:state.bilan,watch:state.watch,draw:state.draw,last:state.last,bon:state.bon}; }
function loadWork(p){ const w=(p&&p.w)||{}; state.set=Object.assign(Z(()=>0),w.set||{}); state.ans=w.ans||Z(()=>({})); IDS.forEach(i=>{ state.ans[i]=state.ans[i]||{}; });
  state.done=Object.assign(Z(()=>false),w.done||{}); state.bonus=w.bonus||{}; state.copyId=w.copyId||{}; state.bilan=w.bilan||{}; state.watch=w.watch||{}; state.draw=w.draw||{}; state.last=w.last||{}; state.bon=w.bon||{}; }
function save(){ try{ stash(); localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---- indices de travail (durée active, collages, pages quittées) ---- */
function wch(id){ state.watch=state.watch||{}; const w=state.watch[id]||(state.watch[id]={ms:0,paste:0,away:0,last:0}); if(w.el===undefined){ w.el=0; w.run=false; } return w; }
function working(){ return IDS.includes(state.tab)&&!state.done[state.tab]&&!ui.picker; }
function tick(e){ if(!working()) return; const w=wch(state.tab), n=Date.now(); if(w.last) w.ms+=Math.min(n-w.last,90000); w.last=n;
  if(!w.run && e && e.target && e.target.closest && e.target.closest('#sheets')){ w.run=true; beat=Date.now(); } }
let hiddenAt=0, beat=Date.now(), beatN=0;
const PER_EX={1:90000,2:75000,3:60000}; /* 15 min, 12 min 30, 10 min pour 10 exercices */
const goalMs=L=>L.ex.length*(PER_EX[lessonLevel(L.id)]||GOAL_PER_EX);
const goalTxt=L=>{ const t=Math.round(goalMs(L)/1000), m=Math.floor(t/60), sc=t%60; return m+' min'+(sc?' '+String(sc).padStart(2,'0'):''); };
const fmtT=ms=>{ const t=Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
function updateTimer(){
  const t=document.getElementById('timer'); if(!t) return;
  if(!working()){ t.hidden=true; return; }
  const L=LESSONS[state.tab], w=wch(L.id), g=goalMs(L), over=(w.el||0)>g; t.hidden=false; t.className='timer'+(over?' over':'');
  t.innerHTML='<span>⏱ '+fmtT(w.el||0)+'</span><small>'+(!w.run?'démarre à ta 1re réponse · conseillé : '+goalTxt(L):(over?'temps conseillé dépassé':'conseillé : '+goalTxt(L)))+'</small>';
}
setInterval(()=>{ const n=Date.now(), dt=Math.min(n-beat,1000); beat=n;
  if(working()&&!document.hidden){ const w=wch(state.tab); if(w.run){ w.el+=dt; if(++beatN%20===0) save(); } }
  updateTimer(); },250);
['input','click','keydown'].forEach(t=>document.addEventListener(t,tick,true));
document.addEventListener('copy',e=>{ if(!working()) return; const t=document.activeElement&&document.activeElement.tagName; if(/^(INPUT|TEXTAREA)$/.test(t||'')) return; wch(state.tab).copy=(wch(state.tab).copy||0)+1; e.preventDefault(); save(); },true);
document.addEventListener('cut',e=>{ if(!working()) return; const t=document.activeElement&&document.activeElement.tagName; if(/^(INPUT|TEXTAREA)$/.test(t||'')) return; e.preventDefault(); },true);
document.addEventListener('paste',()=>{ if(working()){ tick(); wch(state.tab).paste++; save(); } },true);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(hiddenAt){ const gap=Date.now()-hiddenAt; hiddenAt=0; if(working()&&gap>=5000){ const w=wch(state.tab); w.away++; w.last=0; save(); } }
});
function A(L,ex){ const a=state.ans[L.id]; if(a[ex.n]===undefined) a[ex.n]=init(ex); return a[ex.n]; }
function init(ex){
  switch(ex.type){
    case 'fill': return ex.items.map(it=>it.a.map(()=>''));
    case 'choice': return ex.items.map(()=>null);
    case 'click': return ex.items.map(()=>[]);
    case 'build': return ex.dets.map(()=>['','']);
    default: return {};
  }
}

/* ======================= Correction ======================= */
function grade(L,ex){
  const a=A(L,ex);
  if(ex.type==='fill'){ let s=0,t=0; ex.items.forEach((it,i)=>it.a.forEach((acc,k)=>{t++; if(acc.map(norm).includes(norm(a[i][k]))) s++;})); return {s,t}; }
  if(ex.type==='choice'){ let s=0; ex.items.forEach((it,i)=>{ if(a[i]===it.a) s++; }); return {s,t:ex.items.length}; }
  if(ex.type==='click'){ let s=0,t=0; ex.items.forEach((src,i)=>{ const toks=tokenize(src); const E=new Set(toks.map((x,j)=>x.key?j:-1).filter(j=>j>=0)); const S=new Set(a[i]);
      let hit=0,fpos=0; S.forEach(j=>E.has(j)?hit++:fpos++); t+=E.size; s+=Math.max(0,hit-fpos); }); return {s,t}; }
  if(ex.type==='classify'||ex.type==='errors'){ const toks=tokenize(ex.text); let s=0,t=0,fpos=0;
      toks.forEach((x,j)=>{ const exp=ex.type==='classify'?x.key:x.fix; const got=a[j];
        if(exp){ t++; if(got!==undefined && (ex.type==='classify'? got===exp : norm(got)===norm(exp))) s++; }
        else if(got!==undefined) fpos++; });
      return {s:Math.max(0,s-fpos),t}; }
  if(ex.type==='build'){ let s=0; ex.dets.forEach((d,i)=>{ if(ex.valid[d].some(([n,j])=>a[i][0]===n&&a[i][1]===j)) s++; }); return {s,t:ex.dets.length}; }
  return {s:0,t:0};
}
function progress(L){
  let done=0,tot=0;
  L.ex.forEach(ex=>{ const a=A(L,ex);
    if(ex.type==='fill') a.forEach(r=>r.forEach(v=>{tot++; if(norm(v)) done++;}));
    else if(ex.type==='choice') a.forEach(v=>{tot++; if(v) done++;});
    else if(ex.type==='click') a.forEach(v=>{tot++; if(v.length) done++;});
    else if(ex.type==='build') a.forEach(r=>{tot++; if(r[0]&&r[1]) done++;});
    else { const n=tokenize(ex.text).filter(x=>ex.type==='classify'?x.key:x.fix).length; tot+=n; done+=Math.min(n,Object.keys(a).length); }
  });
  return {done,tot};
}

function blankInput(id,val,w,locked,ok){

  if(locked){ i.readOnly=true; i.classList.add(ok?'ok':'ko'); }
  return i;
}

function renderEx(L,ex){

      });

      if(locked && it.why && (ex.showWhy || a[i]!==it.a)) box.append(el('span','why',esc(it.why)));
      li.append(box); ol.append(li);
    });
    card.append(ol);
  }

  if(ex.type==='click'){
    const ol=el('ol','items');
    ex.items.forEach((src,i)=>{
      const li=el('li'); const box=el('div','it'); const toks=tokenize(src); const S=new Set(a[i]);
      toks.forEach((x,j)=>{

        const s=el('span','tok',esc(x.w)); s.id=`${base}-${i}-t${j}`;

          if(S.has(j)&&x.key) s.classList.add('c-ok'); else if(S.has(j)) s.classList.add('c-fp'); else if(x.key) s.classList.add('c-miss');

      li.append(box); ol.append(li);
    });

      const clr=el('button','cat clear',esc(ex.none||'Pas un déterminant')); clr.type='button'; clr.id=`${base}-c-clear`; clr.disabled=cur===undefined||a[cur]===undefined;
      clr.addEventListener('click',()=>{ delete a[cur]; ui.cur[base]=undefined; save(); rerender(L,ex); updateProgress(); }); bar.append(clr);

      if(marked) s.classList.add('err');
      if(locked){
        if(x.fix){ const ok=marked&&norm(a[j])===norm(x.fix); s.classList.add(ok?'c-ok':'c-miss'); tb.append(s); if(!ok) tb.append(el('span','fix sm',esc(x.fix))); return; }

      s.addEventListener('click',tog); s.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tog(); }});
      tb.append(s);

/* ---- détail des erreurs, copie enregistrée, bilan ---- */
function wrongs(L,ex){
  const a=A(L,ex), out=[], cut=s=>{ s=plain(s); return s.length>140?s.slice(0,137)+'…':s; };
  if(ex.type==='fill') ex.items.forEach((it,i)=>it.a.forEach((acc,k)=>{ if(!acc.map(norm).includes(norm(a[i][k]))) out.push({n:ex.n,q:cut((it.p?it.p+' — ':'')+it.q),attendu:acc[0],donne:a[i][k]||'(vide)'}); }));
  if(ex.type==='choice') ex.items.forEach((it,i)=>{ if(a[i]!==it.a) out.push({n:ex.n,q:cut([it.b,'('+(it.opts||ex.opts).join(' / ')+')',it.after].filter(Boolean).join(' ')),attendu:it.a,donne:a[i]||'(vide)'}); });
  if(ex.type==='click') ex.items.forEach((src,i)=>{ const t=tokenize(src); const E=t.map((x,j)=>x.key?j:-1).filter(j=>j>=0); const S=a[i];
    if(!(E.length===S.length&&E.every(j=>S.includes(j)))) out.push({n:ex.n,q:cut(t.map(x=>x.w||x.sp||x.p).join('')),attendu:E.map(j=>t[j].w).join(', '),donne:S.length?S.slice().sort((x,y)=>x-y).map(j=>t[j].w).join(', '):'(rien)'}); });
  if(ex.type==='classify'){ const t=tokenize(ex.text); const lab=k=>(ex.cats.find(c=>c.k===k)||{}).l;
    t.forEach((x,j)=>{ const g=a[j]; if(x.key&&g!==x.key) out.push({n:ex.n,q:x.w,attendu:lab(x.key),donne:g?lab(g):'(non repéré)'}); else if(!x.key&&g) out.push({n:ex.n,q:x.w,attendu:(ex.none||'pas un déterminant').toLowerCase(),donne:lab(g)}); }); }
  if(ex.type==='errors'){ const t=tokenize(ex.text);
    t.forEach((x,j)=>{ const g=a[j]; if(x.fix&&!(g!==undefined&&norm(g)===norm(x.fix))) out.push({n:ex.n,q:x.w,attendu:x.fix,donne:g===undefined?'(non trouvé)':(g||'(vide)')});
      else if(!x.fix&&g!==undefined) out.push({n:ex.n,q:x.w,attendu:'mot juste, à ne pas corriger',donne:g||'(marqué)'}); }); }
  if(ex.type==='build') ex.dets.forEach((d,i)=>{ if(!ex.valid[d].some(([n,j])=>a[i][0]===n&&a[i][1]===j)) out.push({n:ex.n,q:d+' …',attendu:d+' '+ex.valid[d][0].join(' '),donne:[d,a[i][0]||'?',a[i][1]||'?'].join(' ')}); });
  return out;
}

const JEU={1:[15,30,60],2:[10,20,45],3:[0,10,30]};
const jeuMin=(n,lv)=>{ const t=JEU[lv||1]||JEU[1]; return n>=18?t[2]:(n>=15?t[1]:(n>=13?t[0]:0)); };
let RESETS={};
function lessonLevel(id){
  if(!Array.isArray(copies)) return 1; const since='';
  const ok=copies.filter(c=>c.lecon===id&&!c.verif&&String(c.at)>since);
  if(ok.some(c=>c.jeu===45)) return 3; if(ok.some(c=>c.jeu===60)) return 2; return 1;
}

  <tr><th>Temps conseillé</th>${[1,2,3].map(n=>`<td${c(n)}>${T(n)}</td>`).join('')}</tr>
  ${row('18 et plus',2)}${row('15 à 17,5',1)}${row('13 à 14,5',0)}
  <tr><th>Moins de 13</th>${[1,2,3].map(n=>`<td${c(n)}>—</td>`).join('')}</tr></tbody></table>

function levelText(lv){ return lv===3?'Leçon maîtrisée : récompenses au niveau 3 sur 3. Une nouvelle leçon rapporte le maximum.':(lv===2?'Leçon bien réussie : récompenses au niveau 2 sur 3. Une nouvelle leçon rapporte le maximum.':''); }
function flagsOf(c){
  const out=[]; if(typeof c.duree!=='number') return out; const nb=c.nbEx||20;
  if(c.duree<(nb<=10?120:240)) out.push('Très rapide pour '+nb+' exercices');
  if(c.collages>0) out.push('Texte collé ('+c.collages+')');
  if(c.copies>0) out.push('Texte copié depuis la page ('+c.copies+')');
  if(c.absences>=3) out.push('A quitté la page '+c.absences+' fois');
  return out;
}
function prevBase(L){
  if(!Array.isArray(copies)) return null; const nm=curName(), pid=state.cur;
  const list=copies.filter(c=>c.lecon===L.id&&(c.pid?c.pid===pid:(c.eleve||'').trim()===nm));
  return list.length?(Number(list[0].note)||0):null;
}
function computeBonus(L,R){
  const w=wch(L.id); const inTime=!!w.run&&(w.el||0)<=goalMs(L); const pv=prevBase(L);
  return {t:(inTime&&R.note>12)?2:0, p:0, inTime, prev:pv, lvl:lessonLevel(L.id)};
}
function result(L){
  let total=0;
  const scores=L.ex.map(ex=>{ const g=grade(L,ex); total+=g.t?g.s/g.t:0; return {n:ex.n,s:g.s,t:g.t,titre:ex.t}; });
  const erreurs=[].concat(...L.ex.map(ex=>wrongs(L,ex)));
  return {note:Math.round(total*(20/L.ex.length)*2)/2, scores, erreurs};
}

async function saveCopy(L){
  if(state.copyId[L.id]) return;
  await caps;
  if(!DB){ ui.save[L.id]='nodb'; renderFinish(L); return; }
  if(CANW===false){ ui.save[L.id]='denied'; renderFinish(L); return; }
  ui.save[L.id]='saving'; renderFinish(L);
  const R=result(L); const W=wch(L.id);
  const doc={duree:Math.round(W.ms/1000), chrono:Math.round((W.el||0)/1000), collages:W.paste, copies:W.copy||0, absences:W.away, lecon:L.id, titre:L.title, eleve:curName().slice(0,40), nbEx:L.ex.length, pid:state.cur||null, par:UID||null, at:new Date().toISOString(), note:R.note, scores:R.scores, erreurs:R.erreurs.slice(0,200)};
  if(!(state.draw&&state.draw[L.id])) doc.serie=(state.set[L.id]||0)+1;
  const B=state.bon[L.id]||{t:0,p:0}; doc.bonusT=B.t; doc.bonusP=B.p; doc.total=Math.min(20,R.note+B.t+B.p); doc.niveau=B.lvl||1; doc.jeu=jeuMin(doc.total,doc.niveau); doc.verif=flagsOf(doc).length>0;
  try{ const ref=DB.collection('copies').doc(); await ref.set(doc); state.copyId[L.id]=ref.id; ui.save[L.id]='saved'; save(); }
  catch(e){ ui.save[L.id]= e&&e.code==='invalid_argument'?'denied':(e&&e.code==='quota_exceeded'?'quota':'error'); }
  if(state.tab===L.id) renderFinish(L);
}

    const card=el('article','copy'); const id=IDS.includes(c.lecon)?c.lecon:IDS[0];
    const h=el('div','copy-h'); const meta=el('div','meta');
    meta.append(el('div','what',`<span class="lt ${id}" style="background:${LESSONS[id].color||''}">${LNUM[id]}</span>${esc(LTITLE[id])}`));
    const sub=el('div','when'); sub.textContent=[c.eleve,(c.nbEx?c.nbEx+' exercices':'série '+(c.serie||1)),when(c.at)].filter(Boolean).join(' · '); meta.append(sub);
    const nb=Number(c.note)||0, bs=(c.bonusT||0)+(c.bonusP||0), tt=Number(c.total!==undefined?c.total:c.note)||0; const bw=el('div','mbox'); bw.append(el('div','mini'+(tt>=15?' good':''),`${fmt(nb)}<small style="font-size:16px">/20</small>`)); if(bs) bw.append(el('div','mplus',`+${bs} bonus = ${fmt(tt)}/20`)); h.append(meta,bw);
    card.append(h);
    if(typeof c.duree==='number'||typeof c.jeu==='number'){
      const fl=el('div','flags');
      const fd=t=>{ const mn=Math.floor(t/60), sc=t%60; return mn?mn+' min'+(sc?' '+String(sc).padStart(2,'0')+' s':''):sc+' s'; };
      if(typeof c.chrono==='number') fl.append(el('span','tm','⏱ Chrono '+fd(c.chrono)));
      if(typeof c.duree==='number') fl.append(el('span','tm',(typeof c.chrono==='number'?'Activité ':'⏱ ')+fd(c.duree)));
      if(c.jeu>0) fl.append(el('span','game'+(c.verif?' chk':''),'🎮 '+c.jeu+' min'+(c.niveau>1?' · niv. '+c.niveau:'')+(c.verif?' · à valider':'')));
      flagsOf(c).forEach(t=>fl.append(el('span','flag',esc(t))));
      card.append(fl);
    }
    const sc=Array.isArray(c.scores)?c.scores.filter(s=>s&&s.s<s.t):[];
    if(sc.length){ card.append(el('p','sub','Exercices à reprendre'));
      const chips=el('div','chips'); sc.forEach(s=>{ const ch=el('div','chip '+(Number(s.s)===0?'zero':'part'),`<b>${esc(s.n)}</b><span>${esc(s.s)}/${esc(s.t)}</span>`); ch.title=plain(s.titre); chips.append(ch); });
      card.append(chips); }
    else card.append(el('p','status ok','Tous les exercices sont réussis.'));
    const b=cleanBilan(c.bilan); if(b) card.append(bilanBlock(b));
    const errs=Array.isArray(c.erreurs)?c.erreurs:[];
    if(errs.length){
      const det=el('details'); det.append(el('summary',null,`Voir les erreurs (${errs.length})`));
      const ul=el('ul','errs');
      errs.forEach(e=>{ const li=el('li'); li.append(el('b',null,'Ex. '+esc(e.n)+' — ')); li.append(document.createTextNode(plain(e.q)+' : '));
        const g=el('span','g'); g.textContent=plain(e.donne); const ar=document.createTextNode(' → '); const ok=el('span','e'); ok.textContent=plain(e.attendu);
        li.append(g,ar,ok); ul.append(li); });
      det.append(ul); card.append(det);
    }
    wrap.append(card);
  });
  v.append(wrap);
}

function appreciation(n){
  if(n>=18) return 'Excellent travail, bravo !';
  if(n>=15) return 'Très bien ! Encore un petit effort.';
  if(n>=12) return 'Bien. Regarde tes erreurs en rouge.';
  if(n>=10) return "Assez bien. Relis l'aide-mémoire.";
  return "À retravailler : relis la leçon et recommence.";
}

function renderFinish(L){
  const box=document.getElementById('finish'); box.innerHTML='';
  if(!state.done[L.id]){
    const p=progress(L); const left=p.tot-p.done;
    box.append(el('h2',null,'Rendre ma copie'));
    box.append(el('p',null,`Tu as donné ${p.done} réponses sur ${p.tot}. Quand tu as fini, fais corriger ta copie : tu verras tes erreurs en rouge et ta note sur 20.`));

    if(ui.warn && left>0){
      const w=el('div','warn',`Il reste <b>${left}</b> réponse${left>1?'s':''} vide${left>1?'s':''}. Elles compteront comme fausses.`);
      const bt=el('div','btns');
      const go=el('button','btn red','Corriger quand même'); go.type='button'; go.addEventListener('click',()=>correct(L));
      const back=el('button','btn ghost','Continuer à répondre'); back.type='button'; back.addEventListener('click',()=>{ ui.warn=false; renderFinish(L); });
      bt.append(go,back); w.append(bt); box.append(w);
    } else {
      const bt=el('div','btns'); const go=el('button','btn red','Corriger ma copie'); go.type='button'; go.id='btn-correct-'+L.id;
      go.addEventListener('click',()=>{ const pp=progress(L); if(pp.done<pp.tot){ ui.warn=true; renderFinish(L);} else correct(L); });
      bt.append(go); box.append(bt);
    }
    return;
  }
  const R=result(L); const scores=R.scores; const note=R.note;
  const B=state.bon&&state.bon[L.id]; const total=B?Math.min(20,note+B.t+B.p):note;
  box.append(el('h2',null,'Ma note'));
  const bsum=B?(B.t+B.p):0;
  const r=el('div','result'); r.append(el('div','mark',`${fmt(note)}<small>/20</small>`)); if(bsum) r.append(el('div','bplus',`+${bsum}<small>bonus</small>`)); r.append(el('div','appr',esc(appreciation(total)))); box.append(r);
  if(bsum) box.append(el('p','totalline',`Total : <b>${fmt(total)}/20</b>`+(note+bsum>20?' <small>(plafonné à 20)</small>':'')));
  if(B){ const bl=el('ul','bonuses');
        bl.append(el('li',B.t?'ok':'',B.t?'⏱ Dans le temps conseillé avec plus de 12/20 : <b>+2</b>':(B.inTime?'⏱ Dans le temps, mais il faut plus de 12/20 pour le bonus : <b>0</b>':'⏱ Temps conseillé dépassé : <b>0</b>')));
    box.append(bl); }
  { const w=wch(L.id); const fl=flagsOf({duree:Math.round(w.ms/1000),collages:w.paste,copies:w.copy||0,absences:w.away,nbEx:L.ex.length}); const lv=B&&B.lvl?B.lvl:lessonLevel(L.id); const jm=jeuMin(total,lv);
    box.append(el('div','jeu'+(jm?' on':''), jm?(fl.length?'🎮 Temps de jeu : <b>'+jm+' min</b> — à confirmer par un parent':'🎮 Temps de jeu gagné : <b>'+jm+' min</b>'):(lv===3?'🎮 Dès 15/20, tu gagnes du temps de jeu.':'🎮 Dès 13/20, tu gagnes du temps de jeu.')));
    if(lv>1) box.append(el('p','lvl',esc(levelText(lv)))); }
  box.append(el('p',null,`Chaque exercice vaut ${fmt(20/L.ex.length)} point${20/L.ex.length>1?'s':''}, partagé entre ses réponses. Les corrections sont écrites en rouge dans chaque exercice.`));
  const chips=el('div','chips');
  scores.forEach(s=>{ const cls=s.s===s.t?'full':(s.s===0?'zero':'part'); const c=el('div','chip '+cls,`<b>${s.n}</b><span>${s.s}/${s.t}</span>`); c.setAttribute('aria-label',`Exercice ${s.n} : ${s.s} sur ${s.t}`); chips.append(c); });
  box.append(el('p','chips-lbl','Détail par exercice'));
  box.append(chips);
  box.append(saveStatusEl(L));
  box.append(shareEl(L));
  box.append(bilanArea(L));
  const bt=el('div','btns');
  if(ui.confirmReset){
    const w=el('div','warn', state.copyId[L.id]?'Une nouvelle fiche d\'exercices va s\'ouvrir. La copie corrigée reste dans le suivi.':'Une nouvelle fiche d\'exercices va s\'ouvrir. Les réponses actuelles seront effacées.');
    const b2=el('div','btns');
    const yes=el('button','btn red','Oui, nouvelle fiche'); yes.type='button'; yes.addEventListener('click',()=>reset(L));
    const no=el('button','btn ghost','Annuler'); no.type='button'; no.addEventListener('click',()=>{ ui.confirmReset=false; renderFinish(L); });
    b2.append(yes,no); w.append(b2); box.append(w);
  } else {
    const again=el('button','btn ghost','Nouvelle fiche'); again.type='button'; again.addEventListener('click',()=>{ ui.confirmReset=true; renderFinish(L); });
    const other=IDS[(IDS.indexOf(state.tab)+1)%IDS.length];
    const next=el('button','btn',`Aller à la leçon ${LESSONS[other].num}`); next.type='button'; next.addEventListener('click',()=>{ switchTab(other); window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'}); });
    bt.append(again,next); box.append(bt);
  }
}

function correct(L){
  state.bon=state.bon||{}; state.bon[L.id]=computeBonus(L,result(L));
  state.done[L.id]=true; ui.warn=false; delete state.copyId[L.id]; delete state.bilan[L.id]; ui.save[L.id]=undefined; ui.bil[L.id]=undefined;
  save(); renderLesson();
  const f=document.getElementById('finish'); if(f) f.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
  saveCopy(L);
}
function reset(L){
  state.ans[L.id]={}; state.done[L.id]=false; state.bonus[L.id]=''; delete state.copyId[L.id]; delete state.bilan[L.id]; if(state.watch) delete state.watch[L.id]; if(state.bon) delete state.bon[L.id];
  state.draw=state.draw||{}; state.draw[L.id]=makeDraw(L);
  ui.save[L.id]=undefined; ui.bil[L.id]=undefined; ui.confirmReset=false; ui.cur={}; save(); renderLesson();
  window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});
}

function renderAll(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.l===state.tab?'true':'false')); try{ const sel=document.querySelector('.tab[aria-selected="true"]'); const c=sel&&sel.parentElement; if(c) c.scrollLeft+=sel.getBoundingClientRect().left-c.getBoundingClientRect().left-(c.clientWidth-sel.offsetWidth)/2; }catch(e){}
  const sv=state.tab==='suivi'; const pk=ui.picker||(!state.cur&&!sv);
  renderProfBtn();
  document.getElementById('profView').hidden=!pk; document.getElementById('suiviView').hidden=pk||!sv; document.getElementById('lessonView').hidden=pk||sv;
  if(pk){ document.body.dataset.lesson='suivi'; renderProfiles(); }
  else if(sv){ document.body.dataset.lesson='suivi'; renderSuivi(); } else renderLesson();
}

function renderLesson(){
  const L=LESSONS[state.tab];
  document.body.dataset.lesson=L.id;
  ensureDraw(L);
  document.getElementById('eyebrow').textContent=`Leçon ${L.num} · ${L.domain} · ${(state.draw&&state.draw[L.id])?'fiche de '+L.ex.length+' exercices':'série '+((state.set[L.id]||0)+1)+'/'+NSETS}${state.done[L.id]?' · copie corrigée':''}`;
  document.getElementById('h1').textContent=L.title;
  document.getElementById('intro').textContent=state.done[L.id]?`${L.ex.length} exercices corrigés.`:`${L.ex.length} exercices. Réponds directement sur la page, puis fais corriger ta copie pour obtenir ta note sur 20. Un chrono démarre à ta première réponse : si tu finis en ${goalTxt(L)} maximum (temps conseillé${lessonLevel(L.id)>1?' au niveau '+lessonLevel(L.id):''}) avec plus de 12/20, tu gagnes 2 points de bonus.`+(lessonLevel(L.id)>1?' '+levelText(lessonLevel(L.id)):'');
  document.getElementById('memobody').innerHTML=L.memo; { const sd=document.getElementById('story'); if(L.story){ sd.hidden=false; document.getElementById('storybody').innerHTML=L.story; if(sd.dataset.l!==L.id){ sd.open=false; sd.dataset.l=L.id; } } else sd.hidden=true; }
  document.getElementById('rulesbody').innerHTML=rulesHTML(L);
  const sh=document.getElementById('sheets'); sh.innerHTML='';
  L.ex.forEach(ex=>{ const pt=(ex.part!==undefined)?ex.part:L.parts[ex.n]; if(pt) sh.append(el('h2','part',esc(pt))); sh.append(renderEx(L,ex)); });
  renderFinish(L); updateProgress(); updateTimer();
}

function switchTab(id){ ui.picker=false; state.tab=id; ui.warn=false; ui.confirmReset=false; save(); renderAll(); }
const SUIVI_BTN=`<button class="tab" role="tab" id="tab-suivi" data-l="suivi" aria-selected="false"><span class="num"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l4-4 3 3 5-6"/></svg></span>Suivi</button>`;
document.querySelector('.tabs').innerHTML=IDS.map((id,k)=>{ const L=LESSONS[id]; return `<button class="tab" role="tab" id="tab-${id}" data-l="${id}" aria-selected="${k===0}"><span class="num" style="background:${L.color||''}">${L.num}</span>${L.tab}</button>`; }).join('')+SUIVI_BTN;
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.l)));

function start(data){
  const saved=(data&&data.ans)?data:loadSaved();
  if(saved){ state=Object.assign(state,saved); state.bonus=state.bonus||{}; state.copyId=state.copyId||{}; state.bilan=state.bilan||{}; state.eleve=state.eleve||''; state.set=Object.assign(Z(()=>0),state.set||{}); state.done=Object.assign(Z(()=>false),state.done||{}); state.watch=state.watch||{}; state.draw=state.draw||{}; state.last=state.last||{}; state.bon=state.bon||{};
    IDS.forEach(i=>{ state.ans[i]=state.ans[i]||{}; }); state.profiles=Array.isArray(state.profiles)?state.profiles:[]; state.cur=state.cur||'';
    if(!state.profiles.length && false){ const id='p'+Date.now().toString(36); state.profiles.push({id,name:state.eleve.trim().slice(0,40),av:'🦊',w:null}); state.cur=id; stash(); }
    else if(state.cur&&!curP()) state.cur='';
    else if(curP()&&!curP().w) stash();
    if(curP()&&curP().w) loadWork(curP()); }
  if(!state.profiles.length){ const id='p'+Date.now().toString(36); state.profiles.push({id,name:(state.eleve||'').trim().slice(0,40)||'Adam',av:'🦊',w:null}); state.cur=id; stash(); }
  if(!state.cur||!curP()){ state.cur=state.profiles[0].id; loadWork(curP()); }
  ui.picker=false;
  if(![...IDS,'suivi'].includes(state.tab)) state.tab=IDS[0];
  const h=(location.hash||'').slice(1); if(IDS.includes(h)) state.tab=h; else if(h==='accords') state.tab='acc'; else if(h==='determinants') state.tab='det'; else if(h==='suivi') state.tab='suivi';
  renderAll();
}
window.claude?.hot?.snapshot?.(()=>{ stash(); return state; });
start({});
})();
